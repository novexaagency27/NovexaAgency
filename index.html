<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>NOVEXA — Premium Creative Agency | Digital Growth Partner</title>
    <meta name="title" content="NOVEXA — Premium Creative Agency | Digital Growth Partner" />
    <meta name="description" content="NOVEXA is a premium creative agency specializing in brand identity, website design, UI/UX, video editing, motion graphics, and digital marketing. Building brands. Driving growth. Creating impact." />
    <meta name="keywords" content="creative agency, brand identity, website design, UI/UX design, video editing, motion graphics, social media design, digital marketing, NOVEXA" />
    <meta name="author" content="NOVEXA Agency" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://novexa.agency/" />
    <meta property="og:title" content="NOVEXA — Premium Creative Agency | Digital Growth Partner" />
    <meta property="og:description" content="We build brands, drive growth, and create impact. Premium creative agency for ambitious businesses." />
    <meta property="og:image" content="/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://novexa.agency/" />
    <meta property="twitter:title" content="NOVEXA — Premium Creative Agency" />
    <meta property="twitter:description" content="Building Brands. Driving Growth. Creating Impact." />
    <meta property="twitter:image" content="/og-image.jpg" />

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "NOVEXA Agency",
      "description": "Premium creative agency specializing in brand identity, website design, and digital marketing.",
      "url": "https://novexa.agency",
      "logo": "/logo.png",
      "sameAs": [],
      "founder": [
        { "@type": "Person", "name": "Hetvi Koradiya", "jobTitle": "Founder" },
        { "@type": "Person", "name": "Krish Patel", "jobTitle": "Co-Founder" }
      ],
      "serviceArea": "Worldwide",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Creative Services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Brand Identity" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website Design" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "UI/UX Design" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Video Editing" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Motion Graphics" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Social Media Design" } }
        ]
      }
    }
    </script>

    <!-- Google Fonts: Playfair Display + Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
